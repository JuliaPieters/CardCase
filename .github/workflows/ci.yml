name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Firestore security rules: repo-laag test tegen de emulator, nooit tegen het echte
      # project (zie docs/governance/QUALITY.md, docs/governance/SECURITY.md).
      - run: npm run test:rules

      - name: Gitleaks (gelekte secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
