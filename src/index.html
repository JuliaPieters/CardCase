<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>CardCase</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e3350d" />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />
    <!-- Installable as a home-screen app: standalone, no browser bars. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CardCase" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // iOS home-screen apps with a translucent status bar make the viewport shorter than the screen by the status
      // bar's height, so even a fixed full-screen shell stops short at the bottom. When that happens, size the shell
      // (app.html, --app-h) to the screen instead. Browsers and other platforms keep the normal 100%.
      (function () {
        var standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
        if (!standalone) return;
        function fit() {
          var landscape = matchMedia('(orientation: landscape)').matches;
          var h = landscape ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
          var root = document.documentElement.style;
          if (h - innerHeight > 1) root.setProperty('--app-h', h + 'px');
          else root.removeProperty('--app-h');
        }
        fit();
        addEventListener('resize', fit);
        addEventListener('orientationchange', fit);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- crossorigin: CORS responses can be cached by the service worker, opaque ones can't. -->
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@500;700;800&family=Noto+Sans+SC:wght@500;700;800&family=Noto+Sans+TC:wght@500;700&display=swap"
    />
    <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" />
  </head>
  <body>
    <!-- Splash while the app and card catalog load; Angular replaces it. -->
    <app-root>
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: var(--splash-bg)">
        <style>
          :root { --splash-bg: #f7f3e8; --splash-ink: #6a6558; }
          @media (prefers-color-scheme: dark) { :root { --splash-bg: #1a1c22; --splash-ink: #a8a497; } }
        </style>
        <picture>
          <source srcset="icons/logo-dark.png" media="(prefers-color-scheme: dark)" />
          <img src="icons/logo-light.png" alt="CardCase" style="width: min(78vw, 420px); height: auto; display: block" />
        </picture>
        <p style="margin: 0; font: 700 15px/1.4 system-ui, sans-serif; color: var(--splash-ink)">Kaarten laden…</p>
      </div>
    </app-root>
  </body>
</html>
